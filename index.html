<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Document</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<script src="https://smartcaptcha.yandexcloud.net/captcha.js" defer></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Inter', system-ui, -apple-system, sans-serif;
			-webkit-tap-highlight-color: transparent;
			font-family: 'Standart';
		}

		*:root {
			--primary: #4B67FE;
			--primary-dark: #111834;
			--bg-dark: #0D0E12;
			--card-bg: rgba(30, 41, 59, 0.6);
			--text-primary: #f8fafc;
			--text-secondary: #94a3b8;
			--input-border: rgba(255, 255, 255, 0.1);
			--danger: #ff253b;
			--info: #fd7e14;
			--warning: #ffc107;
			--success: #198754;
			--body-bg: linear-gradient(to bottom, #111834, #0D0E12);
		}

		html, body {
			height: 100%;
			max-height: 100vh;
			max-width: 400px;
			/* Ограничение максимальной высоты */
			overflow: hidden;
			/* Запрет прокрутки всей страницы */
		}

		body {
			color: var(--text-primary);
			display: flex;
			flex-direction: column;
			background: var(--body-bg);
		}

		header {
			width: 100%;
			padding: 10px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			flex-shrink: 0;
			gap: 10px;
		}

		@font-face {
			font-family: 'Standart';
			src: url('stealfont.woff');
		}


		.tg-user-container {
			display: flex;
			flex-direction: row;
			align-items: center;
			gap: 5px;
			flex: 1;
			min-width: 0;
		}

		.tg-profile-image {
			width: 50px;
			height: 50px;
			border-radius: 20px;
			overflow: hidden;
			border: 1px solid var(--input-border);
		}

		.tg-profile-names {
			display: flex;
			flex-direction: column;
			font-size: 16px;
			flex: 1;
			min-width: 0;
		}

		.tg-name {
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
		}

		.tg-username {
			display: flex;
			flex-direction: row;
			align-items: center;
			font-size: 13px;
			padding-right: 10px;
			color: var(--primary);
			text-decoration: none;
			background: var(--primary-dark);
			width: fit-content;
			border-radius: 8px;
			gap: 5px;
			border: 1px solid var(--primary);
			max-width: 130px;
		}

		#username {
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
			min-width: 0;
			line-height: 1;
			margin-bottom: -1px;
		}

		.user-icon {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 17px;
			height: 17px;
			border-radius: 7px;
			background: var(--primary);
			color: var(--text-primary);
			line-height: 1;
			font-size: 15px;
			flex-shrink: 0;
		}

		.support {
			display: flex;
			flex-direction: row;
			align-items: center;
			padding: 5px;
			background: var(--primary);
			color: #fff;
			text-decoration: none;
			border-radius: 10px;
			gap: 5px;
			padding-right: 10px;
			letter-spacing: 1.1;
		}

		.icon {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 30px;
			width: 30px;
			background: var(--input-border);
			border-radius: 8px;
		}

		.content {
			flex: 1;
			/* Занимает всё оставшееся пространство */
			display: flex;
			flex-direction: column;
			overflow: hidden;
			/* Скрываем переполнение */
			padding: 15px;
			min-height: 0;
			/* Важно для работы flex в старых браузерах */
		}

		.container {
			flex: 1;
			margin-bottom: 15px;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
		}

		.footer, .head {
			display: flex;
			flex-direction: column;
			gap: 15px;
		}

		.btn {
			flex-shrink: 0;
			/* Кнопка не сжимается */
		}

		.btn button {
			width: 100%;
			height: 60px;
			background: var(--primary);
			color: white;
			border: none;
			border-radius: 12px;
			font-size: 20px;
			font-weight: 600;
			cursor: pointer;
			transition: background 0.3s;
			letter-spacing: 1.1;
		}

		.btn button:hover {
			background: var(--primary-dark);
		}

		.items {
			display: flex;
			flex-direction: row;
			justify-content: space-between;
			gap: 15px;
		}

		.item {
			width: 100%;
			height: 60px;
			background: var(--primary-dark);
			border-radius: 12px;
			padding: 5px;
			display: flex;
			flex-direction: row;
			align-items: center;
			gap: 10px;
		}

		.item-icon {
			flex-shrink: 0;
			height: 50px;
			width: 50px;
			background: var(--bg-dark);
			border-radius: 10px;
			display: flex;
			justify-content: center;
			align-items: center;
			font-size: 40px;
			color: var(--primary);
		}

		.item-info {
			display: flex;
			flex-direction: column;
		}

		.item-title {
			color: var(--primary);
			display: flex;
			flex-wrap: nowrap;
			gap: 6px;
		}

		.footer-text {
			text-align: center;
			color: var(--text-secondary);
			font-size: 0.65rem;
			line-height: 1.4;
			opacity: .5;
		}

		.footer-text a {
			color: var(--primary);
			text-decoration: none;
		}

		h1 {
			text-align: center;
			font-size: 25px;
		}


		.input-container {
			display: flex;
			flex-direction: column;
			gap: 5px;
		}

		.input-title {
			color: var(--primary);
			
			text-align: center;
		}

		.input {
			display: flex;
			flex-direction: row;
			flex-shrink: 0;
			background: var(--bg-dark);
			border: 1px solid var(--primary);
			border-radius: 12px;
			overflow: hidden;
		}

		.input .item-icon {
			/*border-right: 1px solid var(--input-border);*/
			border: none;
			height: 60px;
			width: 60px;
			border-radius: 10px;
			background: var(--primary);
			color: var(--text-primary);
		}

		.input-container input {
			height: 100%;
			width: 100%;
			padding: 10px;
			background: transparent;
			border: none;
			outline: none;
			color: var(--text-primary);
			font-size: 25px;
			letter-spacing: 1.5;
		}

		.details-btn {
			border: none;
			border-radius: 10px;
			padding: 0px 6px;
			background: var(--primary);
			display: flex;
			align-items: center;
			flex-direction: row;
			line-height: 1;
			gap: 5px;
		}
	</style>
</head>
<body>
	<header>
		<div class="tg-user-container">
			<img id="userAvatar" src="song.jpg" class="tg-profile-image" alt="Profile">
			<div class="tg-profile-names">
				<span class="tg-name" id="FirstName">Name Surname</span>
				<a href="" class="tg-username">
					<span class="user-icon">
						<i class="bi bi-at"></i>
					</span>
					<span id="username">Qupinator</span>
				</a>
			</div>
		</div>
		<a href="t.me/qupinator" class="support">
			<span class="icon"><i class="bi bi-info-lg"></i></span>
			Поддержка
		</a>
	</header>

	<form action="" class="content" id="registrationForm">
		<div class="container">
			<div class="head">
				<h1>Регистрация на розыгрыш</h1>
				<div class="input-container">
					<span class="input-title">Игровой никнейм</span>
					<div class="input">
						<div class="item-icon">
							<i class="bi bi-person"></i>
						</div>
						<input type="text" placeholder="Ivan_Ivanov" id="nickname" maxlength="20" autocomplete="off"
						required>
					</div>
				</div>
				<div class="input-container">
					<span class="input-title">Номер банка</span>
					<div class="input">
						<div class="item-icon">
							<i style="font-size:30px" class="bi bi-bank"></i>
						</div>
						<input type="text" id="account" minlength="1" maxlength="7" placeholder="1234567"
						pattern="[1-9][0-9]{0,6}"
						oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length > 0 && this.value[0] === '0') this.value = this.value.substring(1);"
						autocomplete="off" required>
					</div>
				</div>
				<div
					style="height: 100px"
					id="captcha-container"
					class="smart-captcha"
					data-sitekey="ysc1_OtHNu2r206J14VG8HchZ5wsOCBMsKcKPN1EhKDHsd4b15af8"
					></div>
			</div>

			<div class="footer">
				<div class="item">
					<div class="item-icon">
						<i class="bi bi-gift"></i>
					</div>
					<div class="item-info">
						<span class="item-title">Приз <button class="details-btn">Детали <i class="bi bi-chevron-down"></i></button></span>
						<span class="item-subtitle" id="giveaway-price">120 миллиардов доляров</span>
					</div>
				</div>
				<div class="items">
					<div class="item">
						<div class="item-icon">
							<i class="bi bi-hash"></i>
						</div>
						<div class="item-info">
							<span class="item-title">Розыгрыш</span>
							<span class="item-subtitle" id="giveaway-id">#1228</span>
						</div>
					</div>
					<div class="item">
						<div class="item-icon">
							<i style="font-size:30px" class="bi bi-clock"></i>
						</div>
						<div class="item-info">
							<span class="item-title">До конца</span>
							<span class="item-subtitle" id="timer">--:--:--</span>
						</div>
					</div>
				</div>
								<div class="footer-text">
					Нажимая кнопку <u>Участвовать</u> вы автоматически принимаете
					<a href="#" target="_blank">Пользовательское соглашение</a> и
					<a href="#" target="_blank">Политику конфиденциальности</a>
				</div>
			</div>
		</div>
		<div class="btn">
			<button type="submit" id="submitBtn">Участвовать</button>
		</div>
	</form>
	<script>
		// Инициализация Telegram Web App
		const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        // Проверка, что открыто в Telegram
        if (!tg.initDataUnsafe?.user) {
            document.body.innerHTML = `
                <div class="only-telegram">
                    <i class="bi bi-x-circle" style="font-size:35px;line-height:0.9;color:var(--danger)"></i>
                    <div>
                        <h2 style="color:var(--danger);font-weight:500">Ошибка</h2>
                        <p class="danger-info">Приложение должно быть открыто внутри Telegram!</p>
                    </div>
                </div>
                `;
            throw new Error('Not in Telegram');
        }
        
		const user = tg.initDataUnsafe.user;
		const giveawayId = new URLSearchParams(window.location.search).get('giveaway_id') || '1';

		// Функция для обновления данных пользователя
		function updateUserProfile() {
			const FirstNameElement = document.getElementById('FirstName');
			const userAvatarElement = document.getElementById('userAvatar');
			
			

			// Установка имени пользователя
			if (user.first_name) {
				FirstNameElement.textContent = user.first_name;
			} else if (user.username) {
				FirstNameElement.textContent = user.username;
			} else {
				FirstNameElement.textContent = 'User';
			}

			// Установка аватарки пользователя
			if (user.photo_url) {
				userAvatarElement.src = user.photo_url;
			} else {
				userAvatarElement.src = 'song.jpg';
			}

			// Обработчик ошибки загрузки аватарки
			userAvatarElement.onerror = function () {
				this.src = 'song.jpg';
			};
		}

		// Обработка ввода никнейма
		const nicknameInput = document.getElementById('nickname');

		nicknameInput.addEventListener('input', function () {
			let value = this.value;
			value = value.replace(/[^A-Za-z_]/g, '');
			const parts = value.split('_');
			if (parts.length > 2) {
				value = parts[0] + '_' + parts[1];
			}

			const hasUnderscore = value.includes('_');
			const underscoreIndex = value.indexOf('_');

			if (hasUnderscore) {
				if (underscoreIndex < 2) {
					value = value.replace('_', '');
				} else {
					const [firstName,
						lastName] = value.split('_');
					let formatted = '';
					if (firstName) {
						formatted = firstName.charAt(0).toUpperCase() +
						(firstName.length > 1 ? firstName.slice(1).toLowerCase(): '');
					}
					if (lastName !== undefined) {
						formatted += '_';
						if (lastName) {
							formatted += lastName.charAt(0).toUpperCase() +
							(lastName.length > 1 ? lastName.slice(1).toLowerCase(): '');
						}
					}
					value = formatted;
				}
			} else {
				if (value.length > 0) {
					value = value.charAt(0).toUpperCase() + value.slice(1).toLowerCase();
				}
			}
			this.value = value;
		});

		// Валидация формы
		function validateForm() {
			const nickname = document.getElementById('nickname').value.trim();
			const account = document.getElementById('account').value.trim();

			if (!nickname) {
				alert('❌ Введите никнейм');
				return false;
			}

			const hasUnderscore = nickname.includes('_');
			if (hasUnderscore) {
				if (!/^[A-Z][a-z]+_[A-Z][a-z]+$/.test(nickname)) {
					alert('❌ Неверный формат никнейма с фамилией!\nПример: Ivan_Ivanov\n• Первая буква имени заглавная\n• Минимум 2 буквы перед подчеркиванием\n• Первая буква фамилии заглавная\n• Подчеркивание только одно');
					return false;
				}
			} else {
				if (!/^[A-Z][a-z]*$/.test(nickname)) {
					alert('❌ Неверный формат никнейма!\nПервая буква должна быть заглавной, остальные строчные');
					return false;
				}
			}

			if (!/^[1-9][0-9]{0,6}$/.test(account)) {
				alert('❌ Номер счета: 1-7 цифр, первая не 0');
				return false;
			}

			return true;
		}

		// Обработка отправки формы
		document.getElementById('registrationForm').addEventListener('submit', async (e) => {
			e.preventDefault();

			if (!validateForm()) {
				return;
			}

			const submitBtn = document.getElementById('submitBtn');
			const originalText = submitBtn.textContent;
			submitBtn.disabled = true;
			submitBtn.textContent = 'Отправка...';

			try {
				await new Promise(resolve => setTimeout(resolve, 1000));
				const ticketNumber = Math.floor(Math.random() * 900000) + 100000;
				window.location.href = `success.html?ticket=${ticketNumber}&giveaway=1288`;
			} catch (error) {
				console.error('Ошибка:', error);
				alert('⚠️ Ошибка соединения');
			} finally {
				submitBtn.disabled = false;
				submitBtn.textContent = originalText;
			}
		});

		// Таймер
		function updateTimer() {
			const timerElement = document.getElementById('timer');
			const endTime = new Date();
			endTime.setHours(endTime.getHours() + 24);

			function update() {
				const now = new Date();
				const diff = endTime - now;

				if (diff <= 0) {
					timerElement.textContent = '00:00:00';
					return;
				}

				const hours = Math.floor(diff / (1000 * 60 * 60));
				const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((diff % (1000 * 60)) / 1000);

				timerElement.textContent =
				`${hours.toString().padStart(2, '0')}:` +
				`${minutes.toString().padStart(2, '0')}:` +
				`${seconds.toString().padStart(2, '0')}`;
			}

			update();
			setInterval(update, 1000);
		}

		// Инициализация при загрузке
		document.addEventListener('DOMContentLoaded', () => {
			updateUserProfile();
			console.log('Данные пользователя Telegram:', user);
			initCaptcha();
			updateTimer();
		});
	</script>
</body>
</html>
